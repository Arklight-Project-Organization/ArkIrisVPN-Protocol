[package]
name = "arkiris"
version = "1.1.0"
edition = "2024"
description = "High-performance hybrid post-quantum UDP tunnel with LDT low-latency data plane"
license = "Apache-2.0"

[dependencies]
# Async runtime and utilities
tokio = { version = "1.36", features = ["full"] }
clap = { version = "4.4", features = ["derive", "env"] }

# Cryptography
chacha20poly1305 = "0.10"
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
x25519-dalek = { version = "2.0", features = ["static_secrets", "reusable_secrets"] }
# Post-quantum KEM (NIST FIPS 203 ML-KEM-768)
pqcrypto-mlkem = "0.1.1"
pqcrypto-traits = "0.3.5"
zeroize = "1.5"
hex = "0.4"

# Randomness and hashing
rand = { version = "0.8", features = ["std"] }

# Networking / system
tun = { version = "0.6", features = ["async"] }
socket2 = "0.5"
ipnetwork = "0.19"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
log = "0.4"
env_logger = "0.10"
crossterm = "0.28"
libc = "0.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[build-dependencies]
winres = "0.1"